
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hex Gallery</title>

  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <main class="container">
    <header>
      <p class="brand">HEX GALLERY</p>
      <h1>Tambah Foto</h1>
      <p class="subtitle">
        Simpan foto dan kenangan ke GitHub.
      </p>
    </header>

    <form id="galleryForm">

      <label for="image">Link Foto</label>
      <input
        id="image"
        type="url"
        placeholder="https://example.com/foto.jpg"
        required
      >

      <label for="caption">Caption</label>
      <textarea
        id="caption"
        placeholder="Tulis caption foto..."
        maxlength="1000"
        required
      ></textarea>

      <button type="submit" id="submitBtn">
        Simpan Foto
      </button>

      <p id="status"></p>

    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
